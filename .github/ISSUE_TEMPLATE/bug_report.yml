name: 오류 신고
description: 재현 가능한 앱 오류를 알려 주세요.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        API 키, 개인 영상·자막·DB, 개인 경로가 있는 전체 로그는 첨부하지 마세요.
        보안 문제는 SECURITY.md의 비공개 제보 절차를 따릅니다.
  - type: input
    id: version
    attributes:
      label: 앱 버전 또는 커밋
      placeholder: 실행 파일 버전 / 소스 커밋
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: Windows 버전, 설치본/소스 실행 여부. 자막·재생 문제라면 GPU와 드라이버, WSL 사용 여부도 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 어떤 화면에서 무엇을 했는지 순서대로 적어 주세요. 개인 자료 대신 간단한 테스트 자료로 재현해 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 예상한 동작과 실제 동작
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 오류 메시지 또는 화면
      description: 필요한 부분만 첨부하고 이름·폴더 경로·자막 내용·API 키를 가려 주세요.
